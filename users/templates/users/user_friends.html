<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ user.username }}'s Friends | BrainMatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0D0628] text-white font-mono min-h-screen p-6">

  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-purple-400 mb-4 text-center">
      🤝 Amigos de <span class="text-white">@{{ user_profile.username }}</span>
    </h1>

    <form method="get" class="flex justify-center mb-6 gap-2">
      <input type="text" name="q" placeholder="Buscar por nombre" value="{{ query }}"
        class="px-4 py-2 rounded bg-[#1C114A] text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
      <button type="submit"
        class="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-600 rounded text-white font-semibold hover:brightness-110 transition">
        Buscar
      </button>
    </form>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      {% for friend in friends %}
        <a href="{% url 'user_profile_view' friend.username %}"
          class="bg-[#1E1B3A] border border-purple-700 p-4 rounded-lg hover:shadow-lg transition duration-200 group">
          <h2 class="text-xl font-semibold text-blue-400 group-hover:underline">@{{ friend.username }}</h2>
          <p class="text-sm text-gray-400 mt-1">{{ friend.bio|default:"Sin biografía" }}</p>
        </a>
      {% empty %}
        <p class="col-span-full text-gray-400 italic text-center">Este usuario no tiene amigos aún 🥲</p>
      {% endfor %}
    </div>
    <a href="{% url 'user_profile'%}"><- Go back </a>
  </div>

</body>
</html>
